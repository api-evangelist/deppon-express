aid: deppon-express
name: Deppon Express
description: 'Deppon Express (德邦快递), operated by Deppon Logistics Co., Ltd., is a
  major Chinese express delivery and logistics provider specializing in large-parcel
  (heavy/bulky) express, less-than-truckload freight, full-truckload, air freight,
  warehousing, supply chain, and cross-border services. Founded from Cui''s Freight
  Company (1996) and incorporated in 2009, it became part of the JD Logistics group
  in 2022 and ranks among China''s largest express carriers by market share. For
  developers and enterprise partners, Deppon runs the Deppon Open Platform (德邦开放平台,
  established 2015) at dpopen.deppon.com, offering system-integration APIs for order
  creation, standard track/tracking queries, and electronic waybill (面单) printing,
  with access granted to contracted monthly-settlement customers.'
